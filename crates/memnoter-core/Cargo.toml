[package]
name = "memnoter-core"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Portable storage and data operations for Memnoter"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
chrono = "0.4.45"
uuid = { version = "1.23.4", features = ["v4"] }
yrs = "0.24"
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
unicode-normalization = "0.1"
