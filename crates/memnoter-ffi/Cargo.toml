[package]
name = "memnoter-ffi"
version = "0.1.5"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
memnoter-core = { path = "../memnoter-core" }
uniffi = { version = "0.29", features = ["cli"] }
thiserror = "2"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "memnoter-bindgen"
path = "src/bindgen.rs"
