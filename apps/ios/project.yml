name: Memnoter
options:
  preGenCommand: node ../../scripts/sync-version.mjs --ios-only && node ../../scripts/generate-bridge-protocol.mjs --check
  bundleIdPrefix: com.vladyslavnalyvaiko.memnoter
  deploymentTarget:
    iOS: '17.0'
packages:
  MemnoterCore:
    path: MemnoterCore
configFiles:
  Debug: Version.xcconfig
  Release: Version.xcconfig
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
targets:
  Memnoter:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../apple-shared
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/Web
        type: folder
    preBuildScripts:
      - name: Reject development Rust core in release app
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" != Debug ] && [ "$(cat "$SRCROOT/MemnoterCore/MemnoterFFI.xcframework/memnoter-build-profile" 2>/dev/null)" = debug ]; then
            echo "error: Debug Rust core is for local development only. Run ./scripts/build-ios-core.sh to restore the release core before a Release build."
            exit 1
          fi
      - name: Verify bundled web editor
        basedOnDependencyAnalysis: false
        script: |
          if [ ! -f "$SRCROOT/Resources/Web/editor.html" ]; then
            echo "error: Missing Resources/Web/editor.html. Run ./scripts/build-ios-web.sh from the repository root, then xcodegen generate in apps/ios."
            exit 1
          fi
      - name: Configure debug live editor
        basedOnDependencyAnalysis: false
        script: |
          /bin/bash "$SRCROOT/../../scripts/ios-live-plist.sh"
        outputFiles:
          - $(DERIVED_FILE_DIR)/LiveEditor.plist
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.vladyslavnalyvaiko.memnoter.ipad
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: $(DERIVED_FILE_DIR)/LiveEditor.plist
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: 'NO'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: MemnoterCore
  MemnoterTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Memnoter
  MemnoterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Memnoter
    dependencies:
      - target: Memnoter
schemes:
  Memnoter:
    build:
      targets:
        Memnoter: all
        MemnoterTests: [test]
        MemnoterUITests: [test]
    test:
      targets: [MemnoterTests, MemnoterUITests]
      preferredScreenCaptureFormat: screenshots
