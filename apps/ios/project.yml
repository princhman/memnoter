name: Memnoter
options:
  preGenCommand: node ../../scripts/sync-version.mjs --ios-only && node ../../scripts/generate-bridge-protocol.mjs --check
  bundleIdPrefix: com.vladyslavnalyvaiko.memnoter
  deploymentTarget:
    iOS: '17.0'
packages:
  MemnoterCore:
    path: MemnoterCore
configFiles:
  Debug: Version.xcconfig
  Release: Version.xcconfig
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
targets:
  Memnoter:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/Web
        type: folder
    preBuildScripts:
      - name: Verify bundled web editor
        basedOnDependencyAnalysis: false
        script: |
          if [ ! -f "$SRCROOT/Resources/Web/editor.html" ]; then
            echo "error: Missing Resources/Web/editor.html. Run ./scripts/build-ios-web.sh from the repository root, then xcodegen generate in apps/ios."
            exit 1
          fi
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.vladyslavnalyvaiko.memnoter.ipad
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: MemnoterCore
  MemnoterTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Memnoter
  MemnoterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Memnoter
    dependencies:
      - target: Memnoter
schemes:
  Memnoter:
    build:
      targets:
        Memnoter: all
        MemnoterTests: [test]
        MemnoterUITests: [test]
    test:
      targets: [MemnoterTests, MemnoterUITests]
