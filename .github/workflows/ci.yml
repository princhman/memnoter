name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

# A new push replaces the run still going on the same branch. Main keeps every run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # PR merge-base diff; main push before..HEAD; manual dispatch validates everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.diff.outputs.frontend }}
      rust: ${{ steps.diff.outputs.rust }}
      browser: ${{ steps.diff.outputs.browser }}
      benchmark: ${{ steps.diff.outputs.benchmark }}
      web: ${{ steps.diff.outputs.web }}
      web-shards: ${{ steps.diff.outputs.web-shards }}
      sync: ${{ steps.diff.outputs.sync }}
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/ci/select-checks.py classify "$EVENT" "$BASE"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: python3 -m unittest discover -s scripts/tests -p 'test_ci_selection.py'
      - run: node --test scripts/tests/ios-results.test.mjs
      - run: python3 -m unittest discover -s scripts/tests -p 'test_wait_ios_artifact.py'
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.ios == 'true'
        with:
          name: shared-ui-dist
          path: apps/shared-ui/dist
          if-no-files-found: error
          retention-days: 1

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    # Keep browser dependencies on a stable base instead of latest's OS upgrades.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.web-shards || '[1]') }}
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Anki dialog coverage uses the real Rust command harness.
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.shard != 'benchmark'
      - uses: swatinem/rust-cache@v2
        if: matrix.shard != 'benchmark'
        with:
          shared-key: web-ubuntu24
      - run: pnpm install --frozen-lockfile
      - name: Skip command-suggestion index maintenance
        if: matrix.shard != 'benchmark'
        run: sudo rm -f /etc/apt/apt.conf.d/50command-not-found
      - name: Normalize Ubuntu cloud mirrors
        if: matrix.shard != 'benchmark'
        # Runner cloud mirrors can stall dependency installation before tests start.
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          import re

          cloud_uri = rb"https?://(?:azure|[a-z0-9-]+\.ec2)\.archive\.ubuntu\.com/ubuntu/?(?=\s|$)"
          uri = re.compile(rb"(?<!\S)" + cloud_uri)
          legacy = re.compile(rb"^([ \t]*deb(?:-src)?[ \t]+(?:\[[^\]\r\n]*\][ \t]+)?)" + cloud_uri)
          canonical = b"https://archive.ubuntu.com/ubuntu"
          for path in (Path("/etc/apt/sources.list.d/ubuntu.sources"), Path("/etc/apt/sources.list")):
              if not path.exists():
                  continue
              original = path.read_bytes()
              lines = []
              in_uris = False
              for line in original.splitlines(keepends=True):
                  if path.suffix == ".sources":
                      if not line.startswith((b" ", b"\t")):
                          in_uris = line.startswith(b"URIs:")
                      if in_uris:
                          line = uri.sub(canonical, line)
                  else:
                      line = legacy.sub(rb"\g<1>" + canonical, line)
                  lines.append(line)
              normalized = b"".join(lines)
              if normalized != original:
                  path.write_bytes(normalized)
          PY
      - run: pnpm --filter memnoter-shared-ui exec playwright install --with-deps webkit chromium
        if: matrix.shard != 'benchmark'
      - run: pnpm --filter memnoter-shared-ui test:ci --skip-benchmark --test-shard=${{ matrix.shard }}/16
        if: matrix.shard != 'benchmark'
      - name: Run the benchmark with preinstalled browsers
        if: matrix.shard == 'benchmark'
        working-directory: apps/shared-ui
        run: |
          playwright_version=$(node -p "require('playwright/package.json').version")
          docker run --rm --init --ipc=host --env CI \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE/apps/shared-ui" \
            "mcr.microsoft.com/playwright:v$playwright_version-noble" \
            node --experimental-strip-types --import ./tests/support/register.mjs \
            --test --test-timeout=240000 tests/copy-large-note.bench.mjs

  # Preserve the existing required check name across the job split.
  check:
    needs: [changes, frontend, rust, web, sync-server]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/select-checks.py gate check

  sync-server:
    needs: changes
    if: needs.changes.outputs.sync == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sync

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Runs the Worker and Durable Objects locally, including two-device sync
      # through the app's sync engine.
      - run: pnpm test

  ios-build:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    env:
      CARGO_BUILD_JOBS: 4
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/tests/ios-live-plist.test.mjs
      - run: brew install xcodegen
      - name: Identify iOS core toolchain
        id: core-toolchain
        run: |
          echo "version=$( { rustc -Vv; xcodebuild -version; } | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: ios-core
        with:
          path: |
            apps/ios/MemnoterCore/MemnoterFFI.xcframework
            apps/ios/MemnoterCore/Sources/MemnoterCore/memnoter_ffi.swift
          key: ios-core-${{ runner.os }}-${{ runner.arch }}-${{ steps.core-toolchain.outputs.version }}-${{ hashFiles('crates/**', 'Cargo.lock', 'Cargo.toml', 'scripts/build-ios-core.sh') }}
      - run: ./scripts/build-ios-core.sh
        if: steps.ios-core.outputs.cache-hit != 'true'
      # Toolchain and core preparation overlap frontend; wait only at consumption.
      - name: Wait for this run's frontend bundle
        id: frontend
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/wait-ios-artifact.py 900 --frontend
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.frontend.outputs.artifact-id }}
          merge-multiple: true
          path: apps/shared-ui/dist
      - run: ./scripts/build-ios-web.sh --prebuilt
      - run: xcodegen generate
        working-directory: apps/ios
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ios-build/CompilationCache.noindex
          key: ios-compilation-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.core-toolchain.outputs.version }}-${{ github.sha }}
          restore-keys: |
            ios-compilation-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.core-toolchain.outputs.version }}-
      - name: Build the iOS test bundle once
        run: |
          xcodebuild build-for-testing -project apps/ios/Memnoter.xcodeproj -scheme Memnoter \
            -destination 'generic/platform=iOS Simulator' ARCHS=arm64 \
            -derivedDataPath "$RUNNER_TEMP/ios-build" -parallel-testing-enabled NO \
            COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES
          plutil -p "$RUNNER_TEMP"/ios-build/Build/Products/*.xctestrun
          tar -C "$RUNNER_TEMP/ios-build/Build" -czf "$RUNNER_TEMP/ios-tests.tar.gz" Products
      - uses: actions/upload-artifact@v4
        with:
          name: ios-test-bundle
          path: ${{ runner.temp }}/ios-tests.tar.gz
          if-no-files-found: error
          retention-days: 1
      # Published products let the native consumers proceed independently.
      - name: Build iOS release configuration
        run: |
          xcodebuild build -project apps/ios/Memnoter.xcodeproj -scheme Memnoter \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-release" CODE_SIGNING_ALLOWED=NO

  # Reserve the producer's Mac slot before consumers can occupy the pool.
  ios-build-started:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 41
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the build runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/wait-ios-artifact.py 2400 --producer-started

  ios-tests:
    needs: [changes, ios-build-started]
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    permissions:
      actions: read
      contents: read
    # Overall cap: 40m handoff (frontend 15m + producer 25m), 15m native,
    # 10m residual setup/result budget. This cap can truncate step allowances;
    # account-wide queueing can also exhaust the handoff deadline.
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        suite: [drawing, navigation, phone]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        if: matrix.suite == 'navigation'
      - uses: actions/setup-node@v4
        if: matrix.suite == 'navigation'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: matrix.suite == 'navigation'
      # Finish Worker dependency setup before simulator first boot.
      # Boot on this VM while ios-build runs on its separate VM.
      - name: Start the iOS simulator
        timeout-minutes: 5
        run: |
          date -u '+%FT%TZ simulator boot starting'
          sysctl hw.memsize vm.swapusage
          vm_stat
          bash scripts/ci/boot-ios-simulator.sh "${{ matrix.suite == 'phone' && 'iPhone' || 'iPad' }}"
      - name: Wait for this run's test bundle
        id: bundle
        timeout-minutes: 41
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/wait-ios-artifact.py 2400
      - name: Download and verify the test bundle
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.bundle.outputs.artifact-id }}
        run: |
          read_artifact() {
            local destination="$1" attempt status
            shift
            for attempt in 1 2; do
              if gh api "$@" > "$destination"; then
                return 0
              else
                status=$?
              fi
              if [[ "$attempt" == 2 ]]; then
                return "$status"
              fi
              echo "Artifact read failed; retrying (attempt 2/2)" >&2
              sleep 2
            done
          }
          artifact="repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
          read_artifact "$RUNNER_TEMP/ios-test-bundle.digest" "$artifact" --jq '.digest'
          digest=$(cat "$RUNNER_TEMP/ios-test-bundle.digest")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          archive="$RUNNER_TEMP/ios-test-bundle.zip"
          read_artifact "$archive" "$artifact/zip"
          printf '%s  %s\n' "${digest#sha256:}" "$archive" | shasum -a 256 --check
      - name: Unpack the test bundle
        timeout-minutes: 2
        run: |
          unzip -q "$RUNNER_TEMP/ios-test-bundle.zip" -d "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/ios-tests"
          tar -C "$RUNNER_TEMP/ios-tests" -xzf "$RUNNER_TEMP/ios-tests.tar.gz"
      - name: Wait for the simulator
        timeout-minutes: 5
        run: |
          xcrun simctl bootstatus "$IOS_SIMULATOR_ID" -b
          date -u '+%FT%TZ simulator ready, bundle unpacked'
      - name: Run native tests
        timeout-minutes: 15
        env:
          IOS_TEST_SUITE: ${{ matrix.suite }}
        run: |
          sysctl hw.memsize vm.swapusage
          vm_stat
          top -l 0 -s 10 -n 15 -o cpu -stats pid,command,cpu,mem,threads,state,time > "$RUNNER_TEMP/ios-resources.log" &
          resource_monitor=$!
          trap 'kill "$resource_monitor" 2>/dev/null || true' EXIT
          bash scripts/ci/run-ios-tests.sh
      - name: Verify native tests actually ran
        if: always()
        env:
          IOS_TEST_SUITE: ${{ matrix.suite }}
        run: |
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/ios-tests.xcresult" > "$RUNNER_TEMP/ios-tests.json"
          python3 scripts/ci/check-ios-results.py "$IOS_TEST_SUITE" "$RUNNER_TEMP/ios-tests.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results-${{ matrix.suite }}
          path: |
            ${{ runner.temp }}/ios-tests.xcresult
            ${{ runner.temp }}/ios-tests.json
            ${{ runner.temp }}/wrangler.log
            ${{ runner.temp }}/simulators.json
            ${{ runner.temp }}/ios-resources.log

  # Preserve the required iOS check across the build/test split.
  ios:
    needs: [changes, frontend, ios-build, ios-build-started, ios-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/select-checks.py gate ios
