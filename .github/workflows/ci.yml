name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
      - run: pnpm lint

      # tests/math-caret.test.mjs drives the editor in WebKit.
      - run: pnpm exec playwright install webkit

      - run: pnpm test

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  sync-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync-server

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: sync-server/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Runs the Worker and Durable Objects locally, including two-device sync
      # through the app's sync engine.
      - run: pnpm test
