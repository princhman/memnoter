name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
      - run: pnpm lint

      # apps/shared-ui/tests/math-caret.test.mjs drives the editor in WebKit.
      - run: pnpm --filter memnoter-shared-ui exec playwright install webkit

      - run: pnpm test

      - name: cargo test
        run: cargo test --workspace

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  sync-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sync

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Runs the Worker and Durable Objects locally, including two-device sync
      # through the app's sync engine.
      - run: pnpm test

  ios:
    # The core script produces an arm64 simulator XCFramework slice.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: brew install xcodegen
      - run: ./scripts/build-ios-core.sh
      - run: ./scripts/build-ios-web.sh
      - run: xcodegen generate
        working-directory: apps/ios
      - name: Select an installed iPad simulator
        run: |
          simulator_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPad")))')
          echo "IOS_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
      - name: Run iOS tests against the local sync worker
        run: |
          ./scripts/ensure-sync-vars.sh
          pnpm --dir apps/sync exec wrangler dev --local --ip 0.0.0.0 --port 8787 > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            kill -0 "$worker_pid" || { cat "$RUNNER_TEMP/wrangler.log"; exit 1; }
            if curl --silent --output /dev/null http://localhost:8787; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat "$RUNNER_TEMP/wrangler.log"; exit 1; fi
          xcodebuild test -project apps/ios/Memnoter.xcodeproj -scheme Memnoter \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/ios-tests.xcresult"
          # E2E must execute, not silently pass through its worker/Keychain skip.
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/ios-tests.xcresult" > "$RUNNER_TEMP/ios-tests.json"
          python3 - "$RUNNER_TEMP/ios-tests.json" <<'PY'
          import json, sys
          def walk(value):
              if isinstance(value, dict):
                  yield value
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from walk(child)
          tests = [node for node in walk(json.load(open(sys.argv[1]))) if node.get('nodeType') == 'Test Case' and 'testTwoNativeDatabasesMergeConcurrentYjsEdits' in node.get('name', '')]
          assert tests and all(t.get('result') == 'Passed' for t in tests), tests
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: |
            ${{ runner.temp }}/ios-tests.xcresult
            ${{ runner.temp }}/ios-tests.json
            ${{ runner.temp }}/wrangler.log
