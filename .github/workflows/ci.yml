name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A new push replaces the run still going on the same branch. Main keeps every run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Decides which jobs a PR needs. Pushes to main always run everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "ios=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD)
          echo "$files"
          # Docs and agent config only: nothing to build or test.
          code=$(echo "$files" | grep -vqE '(\.md$|^docs/|^scripts/agent-hooks/|^\.gitignore$)' && echo true || echo false)
          # The iOS app bundles all of shared-ui, but its own tests exercise the
          # native bridge; other shared-ui changes are covered by check and by main.
          ios=$(echo "$files" | grep -qE '^(apps/ios/|apps/apple-shared/|crates/|apps/sync/|apps/shared-ui/src/editor-host/|apps/shared-ui/src/lib/(editor-host|native-)|apps/shared-ui/package\.json|scripts/(build-ios|ios-|ensure-sync|generate-bridge|sync-version)|Cargo\.(toml|lock)|pnpm-lock\.yaml|\.github/workflows/ci\.yml)' && echo true || echo false)
          echo "code=$code" >> "$GITHUB_OUTPUT"; echo "ios=$ios" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: pnpm install --frozen-lockfile

      - run: node --test scripts/tests/ios-live-plist.test.mjs
      - run: pnpm build
      - run: pnpm lint

      # Editor tests use WebKit; desktop navigation also covers Chromium layout.
      - run: pnpm --filter memnoter-shared-ui exec playwright install webkit chromium

      # Reruns a failing file alone once; only repeat failures fail the job.
      - run: pnpm --filter memnoter-shared-ui test:ci

      - name: cargo test
        run: cargo test --workspace

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  sync-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sync

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Runs the Worker and Durable Objects locally, including two-device sync
      # through the app's sync engine.
      - run: pnpm test

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    # The core script produces an arm64 simulator XCFramework slice.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 4
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: brew install xcodegen
      - run: ./scripts/build-ios-core.sh
      - run: ./scripts/build-ios-web.sh
      - run: xcodegen generate
        working-directory: apps/ios
      - name: Select and boot the SDK's iPad simulator
        run: |
          xcodebuild -version
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          simulator_id=$(python3 - "$RUNNER_TEMP/simulators.json" <<'PYTHON'
          import json, subprocess, sys
          sdk = subprocess.check_output(["xcrun", "--sdk", "iphonesimulator", "--show-sdk-version"], text=True).strip()
          runtime = "com.apple.CoreSimulator.SimRuntime.iOS-" + sdk.replace(".", "-")
          devices = json.load(open(sys.argv[1]))["devices"].get(runtime, [])
          ipads = sorted((d for d in devices if d["name"].startswith("iPad")), key=lambda d: (d["name"], d["udid"]))
          if not ipads:
              raise SystemExit(f"No installed iPad for SDK {sdk}: {devices}")
          print(ipads[0]["udid"])
          PYTHON
          )
          echo "IOS_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$simulator_id" -b
      - name: Build iOS tests
        run: |
          xcodebuild build-for-testing -project apps/ios/Memnoter.xcodeproj -scheme Memnoter \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/ios-build" -parallel-testing-enabled NO
      - name: Run iOS tests against the local sync worker
        run: |
          ./scripts/ensure-sync-vars.sh
          node scripts/ios-test-with-worker.mjs xcodebuild test-without-building \
            -project apps/ios/Memnoter.xcodeproj -scheme Memnoter \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/ios-build" \
            -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/ios-tests.xcresult"
          # E2E must execute, not silently pass through its worker/Keychain skip.
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/ios-tests.xcresult" > "$RUNNER_TEMP/ios-tests.json"
          python3 - "$RUNNER_TEMP/ios-tests.json" <<'PY'
          import json, sys
          def walk(value):
              if isinstance(value, dict):
                  yield value
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from walk(child)
          tests = [node for node in walk(json.load(open(sys.argv[1]))) if node.get('nodeType') == 'Test Case' and 'testTwoNativeDatabasesMergeConcurrentYjsEdits' in node.get('name', '')]
          assert tests and all(t.get('result') == 'Passed' for t in tests), tests
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: |
            ${{ runner.temp }}/ios-tests.xcresult
            ${{ runner.temp }}/ios-tests.json
            ${{ runner.temp }}/wrangler.log
            ${{ runner.temp }}/simulators.json
